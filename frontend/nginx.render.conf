# ============================================================
# Nginx config for Render — SPA + API proxy to backend
# ============================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Security headers
  server_tokens off;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=frontend:10m rate=30r/s;

  # Logging
  log_format main '$remote_addr - [$time_local] "$request" '
                  '$status $body_bytes_sent';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # ─── Backend upstream ──────────────────────────────────────
  # Render injects BACKEND_URL at runtime via envsubst
  # Fallback: the URL you shared
  # We use envsubst to replace $BACKEND_URL in the config
  # ───────────────────────────────────────────────────────────

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets — far-future cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri $uri/ =404;
    }

    # ── API proxy → Render backend ───────────────────────────
    # All /api/* requests are forwarded to the backend service
    location /api/ {
      # Render internal DNS for service-to-service
      # Format: https://<service-name>.internal (no port needed)
      # Or use the public URL if internal DNS isn't available
      proxy_pass https://backend-inventario-izo8.onrender.com;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";

      # Timeouts
      proxy_connect_timeout 30s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # ── Health check for Render ──────────────────────────────
    location /health {
      access_log off;
      return 200 '{"status":"ok","service":"frontend"}';
      add_header Content-Type application/json;
    }

    # SPA fallback — all other routes → index.html
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Deny hidden files
    location ~ /\. {
      deny all;
    }

    # Deny sensitive files
    location ~ (\.env|composer\.json|package\.json|yarn\.lock)$ {
      deny all;
    }
  }
}
