version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &service-healthcheck
  interval: 30s
  timeout: 5s
  start_period: 20s
  retries: 3

services:
  # Redis (para rate limiting y caché)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - inventory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    depends_on:
      redis:
        condition: service_started
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      category-service:
        condition: service_started
      inventory-service:
        condition: service_started
      purchase-service:
        condition: service_started
      sale-service:
        condition: service_started
      report-service:
        condition: service_started
      invoice-service:
        condition: service_started
      ecommerce-service:
        condition: service_started
      catalog-service:
        condition: service_started
      email-service:
        condition: service_started
      whatsapp-service:
        condition: service_started
      notification-service:
        condition: service_started
      audit-service:
        condition: service_started
      config-service:
        condition: service_started
    networks:
      - inventory-network
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Microservicios
  auth-service:
    build: { context: ./backend, dockerfile: services/auth-service/Dockerfile }
    ports: ["3001:3001"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"] }
    logging: *default-logging
    deploy: { resources: { limits: { cpus: '0.3', memory: 256M } } }

  user-service:
    build: { context: ./backend, dockerfile: services/user-service/Dockerfile }
    ports: ["3002:3002"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"] }
    logging: *default-logging
    deploy: { resources: { limits: { cpus: '0.3', memory: 256M } } }

  product-service:
    build: { context: ./backend, dockerfile: services/product-service/Dockerfile }
    ports: ["3003:3003"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"] }
    logging: *default-logging
    deploy: { resources: { limits: { cpus: '0.3', memory: 256M } } }

  category-service:
    build: { context: ./backend, dockerfile: services/category-service/Dockerfile }
    ports: ["3004:3004"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped
    healthcheck: { <<: *service-healthcheck, test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"] }
    logging: *default-logging
    deploy: { resources: { limits: { cpus: '0.2', memory: 128M } } }

