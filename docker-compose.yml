version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    env_file: ./backend/.env
    depends_on:
      - auth-service
      - user-service
      - product-service
      - category-service
      - inventory-service
      - purchase-service
      - sale-service
      - report-service
      - invoice-service
      - cart-service
      - checkout-service
      - ecommerce-service
      - catalog-service
      - email-service
      - whatsapp-service
      - notification-service
      - audit-service
      - config-service
    networks:
      - inventory-network
    restart: unless-stopped

  # Microservicios
  auth-service:
    build: { context: ./backend, dockerfile: services/auth-service/Dockerfile }
    ports: ["3001:3001"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  user-service:
    build: { context: ./backend, dockerfile: services/user-service/Dockerfile }
    ports: ["3002:3002"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  product-service:
    build: { context: ./backend, dockerfile: services/product-service/Dockerfile }
    ports: ["3003:3003"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  category-service:
    build: { context: ./backend, dockerfile: services/category-service/Dockerfile }
    ports: ["3004:3004"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  inventory-service:
    build: { context: ./backend, dockerfile: services/inventory-service/Dockerfile }
    ports: ["3005:3005"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  purchase-service:
    build: { context: ./backend, dockerfile: services/purchase-service/Dockerfile }
    ports: ["3006:3006"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  sale-service:
    build: { context: ./backend, dockerfile: services/sale-service/Dockerfile }
    ports: ["3007:3007"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  report-service:
    build: { context: ./backend, dockerfile: services/report-service/Dockerfile }
    ports: ["3008:3008"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  invoice-service:
    build: { context: ./backend, dockerfile: services/invoice-service/Dockerfile }
    ports: ["3009:3009"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  cart-service:
    build: { context: ./backend, dockerfile: services/cart-service/Dockerfile }
    ports: ["3010:3010"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  checkout-service:
    build: { context: ./backend, dockerfile: services/checkout-service/Dockerfile }
    ports: ["3011:3011"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  ecommerce-service:
    build: { context: ./backend, dockerfile: services/ecommerce-service/Dockerfile }
    ports: ["3012:3012"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  catalog-service:
    build: { context: ./backend, dockerfile: services/catalog-service/Dockerfile }
    ports: ["3013:3013"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  email-service:
    build: { context: ./backend, dockerfile: services/email-service/Dockerfile }
    ports: ["3014:3014"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  whatsapp-service:
    build: { context: ./backend, dockerfile: services/whatsapp-service/Dockerfile }
    ports: ["3015:3015"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  notification-service:
    build: { context: ./backend, dockerfile: services/notification-service/Dockerfile }
    ports: ["3016:3016"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  audit-service:
    build: { context: ./backend, dockerfile: services/audit-service/Dockerfile }
    ports: ["3017:3017"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

  config-service:
    build: ./backend/services/config-service
    ports: ["3018:3018"]
    env_file: ./backend/.env
    networks: [inventory-network]
    restart: unless-stopped

networks:
  inventory-network:
    driver: bridge
